services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-demo}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Defina PG_PASSWORD no .env}
      POSTGRES_DB: ${PG_DATABASE:-smb_demo}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alertas.rules.yml:/etc/prometheus/alertas.rules.yml
    ports:
      - "9090:9090"

  api-pagamentos:
    image: quay.io/brancz/prometheus-example-app:v0.5.0

volumes:
   db_data:
